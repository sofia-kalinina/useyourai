name: Deploy Frontend (prod)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/deploy-frontend-shared.yml
    with:
      tfc_workspace: ${{ vars.TFC_WORKSPACE_PROD }}
      api_stage: prod
    secrets: inherit
